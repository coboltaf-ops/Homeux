    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 620px;
      width: 90%;
      background: #1e293b;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat {
      background: #334155;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .stat .number { font-size: 1.6rem; font-weight: 700; color: #38bdf8; }
    .stat .label { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    .buttons { display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    .btn-load { background: #22c55e; color: white; }
    .btn-load:hover { background: #16a34a; }
    .btn-clean { background: #dc2626; color: white; }
    .btn-clean:hover { background: #b91c1c; }
    .msg {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 500;
      font-size: 0.9rem;
      line-height: 1.6;
      display: none;
    }
    .msg.success { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .msg.error { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
  </style>
</head>

const ALL_KEYS = [
  "homeux-config-storage",
  "homeux-auth-storage",
  "homeux-clientes-storage",
  "homeux-solicitudes-storage",
  "homeux-productos-storage",
  "homeux-personal-storage",
  "homeux-cotizaciones-storage"
];

function cargarDatos() {
  try {
    localStorage.setItem("homeux-config-storage",       JSON.stringify(configData));
    localStorage.setItem("homeux-auth-storage",          JSON.stringify(authData));
    localStorage.setItem("homeux-clientes-storage",      JSON.stringify(clientesData));
    localStorage.setItem("homeux-solicitudes-storage",   JSON.stringify(solicitudesData));
    localStorage.setItem("homeux-productos-storage",     JSON.stringify(productosData));
    localStorage.setItem("homeux-personal-storage",      JSON.stringify(personalData));
    localStorage.setItem("homeux-cotizaciones-storage",  JSON.stringify(cotizacionesData));

    var msg = document.getElementById("msg");
    msg.innerHTML = "<strong>Datos cargados exitosamente:</strong><br>" +
      "8 Clientes | 6 Solicitudes | 10 Productos | 3 Cotizaciones | 4 Personal<br>" +
      "Configuracion y Auth actualizados para Lima, Peru<br><br>" +
      "Redirigiendo al aplicativo...";
    msg.className = "msg success";

    setTimeout(function() {
      window.location.href = "http://localhost:3005";
    }, 2000);
  } catch (e) {
    var msg = document.getElementById("msg");
    msg.textContent = "Error al cargar datos: " + e.message;
    msg.className = "msg error";
  }
}

function limpiarDatos() {
  if (!confirm("Esto eliminara TODOS los datos de HomeUx del navegador. Continuar?")) return;
  ALL_KEYS.forEach(function(k) { localStorage.removeItem(k); });
  var msg = document.getElementById("msg");
  msg.innerHTML = "<strong>Todos los datos de HomeUx han sido eliminados.</strong><br>Recarga el aplicativo para empezar de cero.";
  msg.className = "msg success";
}
</script>
